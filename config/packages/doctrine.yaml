doctrine:
    dbal:
        url: "%env(resolve:DATABASE_URL)%"

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'
        types:

        profiling_collect_backtrace: "%kernel.debug%"
    orm:
        validate_xml_mapping: false
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        mappings:
            App\IdentityAndAccess:
                type: xml
                is_bundle: false
                dir: "%kernel.project_dir%/src/IdentityAndAccess/Infrastructure/Persistence/Doctrine/Mapping"
                prefix: 'App\IdentityAndAccess\Domain\Entity'

            App\Bridges:
                type: xml
                is_bundle: false
                dir: "%kernel.project_dir%/src/Bridges/Infrastructure/Persistence/Doctrine/Mapping"
                prefix: App\Bridges\Infrastructure\Persistence\Doctrine\Entity

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: "_test%env(default::TEST_TOKEN)%"

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
