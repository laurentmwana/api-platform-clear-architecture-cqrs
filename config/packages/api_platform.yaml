api_platform:
    title: Lopango Backend
    version: 1.0.0

    defaults:
        stateless: true
        cache_headers:
            vary: ["Content-Type", "Authorization", "Origin"]

        # The first format listed is the default format used by the API.
        # Plain JSON is enforced here to prevent Hypermedia pollution (JSON-LD) on auth tokens.
        formats:
            json: ["application/json"]
            jsonld: ["application/ld+json"]

        denormalization_context:
            collect_denormalization_errors: true

    swagger:
        api_keys:
            JWT:
                name: Authorization
                type: header

    # Clean mapping of Hexagonal Architecture domain exceptions to HTTP status codes
    exception_to_status:
        App\IdentityAndAccess\Domain\Exception\AuthenticationException: 401
        App\IdentityAndAccess\Domain\Exception\UserNotFoundException: 404
        App\SharedContext\Domain\Exception\UnprocessableException: 422
